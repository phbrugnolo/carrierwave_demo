          </div>

          <!-- Lista de pessoas selecionadas -->
          <div id="pessoasSelecionadas" class="border rounded p-3 mb-3" style="min-height: 100px;">
            <small class="text-muted">Pessoas selecionadas aparecerão aqui</small>
          </div>
        </div>

          <button type="button" class="btn btn-secondary me-2" onclick="confirmarCancelamento()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Registrar participantes</button>
        </div>
      </form>
    </div>

      let pessoasFiltradas = [...pessoasDisponiveis];

      // Função para obter a classe CSS da tag do tipo
      function obterClasseTipo(tipo) {
        switch(tipo) {
          case 'Beneficiário':
            return 'bg-success';
          case 'Ex-Beneficiário':
            return 'bg-secondary';
          case 'Completo':
            return 'bg-info';
          default:
            return 'bg-secondary';
        }
      }

      // Inicializar grid de pessoas
      function inicializarGridPessoas() {
        // Não exibir nada inicialmente
      }

      // Implementar pesquisa de pessoas
      document.getElementById('pesquisaPessoa').addEventListener('input', () => {
        const termo = this.value.toLowerCase();
        const sugestoes = document.getElementById('sugestoesPessoas');
        
        const resultados = pessoasDisponiveis.filter(pessoa => 
          pessoa.nome.toLowerCase().includes(termo) && 
          !pessoasSelecionadas.find(p => p.id === pessoa.id)
        );

        if (resultados.length > 0) {
          sugestoes.innerHTML = resultados.map(pessoa => 
            `<div class="p-3 border-bottom cursor-pointer hover-bg-light d-flex align-items-center" onclick="adicionarPessoa(${pessoa.id}, '${pessoa.nome}', ${pessoa.idade}, '${pessoa.tipo}', '${pessoa.foto}')" style="cursor: pointer;">

              <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-start">

                    <strong>${pessoa.nome}</strong>
                    <div class="text-muted small">${pessoa.idade} anos</div>
                  </div>
                  <span class="badge ${obterClasseTipo(pessoa.tipo)} text-white">${pessoa.tipo}</span>
                </div>
              </div>
            </div>`
          ).join('');
          sugestoes.style.display = 'block';
        } else {
          sugestoes.style.display = 'none';
        }
      });

      // Mostrar todas as pessoas ao clicar no campo
      document.getElementById('pesquisaPessoa').addEventListener('focus', () => {
        const termo = this.value.toLowerCase();
        const sugestoes = document.getElementById('sugestoesPessoas');
        
        const resultados = pessoasDisponiveis.filter(pessoa => 
          pessoa.nome.toLowerCase().includes(termo) && 
          !pessoasSelecionadas.find(p => p.id === pessoa.id)
        );

        if (resultados.length > 0) {
          sugestoes.innerHTML = resultados.map(pessoa => 
            `<div class="p-3 border-bottom cursor-pointer hover-bg-light d-flex align-items-center" onclick="adicionarPessoa(${pessoa.id}, '${pessoa.nome}', ${pessoa.idade}, '${pessoa.tipo}', '${pessoa.foto}')" style="cursor: pointer;">
              <img src="${pessoa.foto}" alt="Foto" class="rounded-circle me-3" style="width: 40px; height: 40px; object-fit: cover;">
              <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-start">
                  <div>
                    <strong>${pessoa.nome}</strong>
                    <div class="text-muted small">${pessoa.idade} anos</div>
                  </div>
                  <span class="badge ${obterClasseTipo(pessoa.tipo)} text-white">${pessoa.tipo}</span>
                </div>
              </div>
            </div>`
          ).join('');
          sugestoes.style.display = 'block';
        }
      });

      // Esconder sugestões quando clicar fora
      document.addEventListener('click', function(event) {
        const pesquisa = document.getElementById('pesquisaPessoa');
        const sugestoes = document.getElementById('sugestoesPessoas');
        
        if (!pesquisa.contains(event.target) && !sugestoes.contains(event.target)) {
          sugestoes.style.display = 'none';
        }
      });

      // Adicionar pessoa à lista
      function adicionarPessoa(id, nome, idade, tipo, foto) {
        const pessoa = { id, nome, idade, tipo, foto };
        pessoasSelecionadas.push(pessoa);
        
        // Limpar campo de pesquisa e sugestões
        document.getElementById('pesquisaPessoa').value = '';
        document.getElementById('sugestoesPessoas').style.display = 'none';
        
        // Atualizar lista visual
        atualizarListaPessoas();
      }

      // Remover pessoa da lista
      function removerPessoa(id) {
        pessoasSelecionadas = pessoasSelecionadas.filter(p => p.id !== id);
        atualizarListaPessoas();
      }

      // Atualizar display da lista de pessoas selecionadas
      function atualizarListaPessoas() {
        const container = document.getElementById('pessoasSelecionadas');
        
        if (pessoasSelecionadas.length === 0) {
          container.innerHTML = '<small class="text-muted">Pessoas selecionadas aparecerão aqui</small>';
        } else {
          container.innerHTML = `
            <div class="row">
              ${pessoasSelecionadas.map(pessoa => 
                `<div class="col-12 col-md-6 col-lg-4 mb-3">
                  <div class="border rounded p-3 h-100">
                    <div class="d-flex align-items-center mb-2">
                      <img src="${pessoa.foto}" alt="Foto" class="rounded-circle me-3" style="width: 50px; height: 50px; object-fit: cover;">
                      <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-start">
                          <div>
                            <strong>${pessoa.nome}</strong>
                            <div class="text-muted small">${pessoa.idade} anos</div>
                          </div>
                          <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerPessoa(${pessoa.id})">
                            <i class="bi bi-x"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                    <div class="text-center">
                      <span class="badge ${obterClasseTipo(pessoa.tipo)} text-white">${pessoa.tipo}</span>
                    </div>
                  </div>
                </div>`
              ).join('')}
            </div>
          `;
        }
      }

      // Inicializar ao carregar a página
      document.addEventListener('DOMContentLoaded', () => {
        inicializarGridPessoas();
      });

  </body>
</html>
